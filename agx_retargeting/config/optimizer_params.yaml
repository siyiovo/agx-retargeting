initializer:
  reference_q: null
  position_sigma: 0.05
  smooth_weight: 2.5
  max_evaluations: 10

residual:
  pair_sigma: 0.0075  # m
  bone_sigma: 0.6  # rad
  shape_sigma: 0.02  # m
  wrist_sigma: [0.003, 0.003, 0.003, 0.05, 0.05, 0.05]
  wrist_process_sigma: [0.02, 0.02, 0.02, 0.3, 0.3, 0.3]
  acceleration_sigma: 100.0  # rad/s^1.5
  initial_velocity_sigma: 3.0  # rad/s
  motion_sigma: 0.7  # m/s
  motion_weight: 0.1
  huber_delta: 2.0
  pinch:
    center_distance: 0.04
    slope: 100.0

solver:
  backend: proxqp
  max_evaluations: 20
  gradient_tolerance: 1.0e-5
  cost_tolerance: 1.0e-5
  step_tolerance: 1.0e-5
  proxqp:
    initial_damping: 1.0e-4
    absolute_tolerance: 1.0e-9
    max_iterations: 100
